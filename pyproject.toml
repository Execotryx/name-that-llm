[project]
name = "name-that-llm"
version = "0.1.0"
authors = [
    { name = "Execotryx", email = "execotryx@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "packaging>=26.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ntl"

[project.scripts]
ntl = "ntl.cli:main"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
